spring:
  application:
    name: giwa

  sql:
    init:
      mode: never

  datasource:
    url: "jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:giwa_receivable}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:}}

server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:local-mvp-jwt-secret-key-must-be-long-enough}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  blockchain:
    rpc-url: ${GIWA_RPC_URL:https://sepolia-rpc.giwa.io}
    chain-id: ${GIWA_CHAIN_ID:91342}
    receivable-finance-address: ${GIWA_RECEIVABLE_FINANCE_ADDRESS:0x0f264334f98BA0d22f7Fc6Bb901a5Fa36158a315}
    mock-krw-address: ${GIWA_MOCK_KRW_ADDRESS:0x5cD8a99Dcf5Fa00fb4fD9873b41A15F9C13C9d3F}
    rpc-timeout-ms: ${GIWA_RPC_TIMEOUT_MS:10000}
    min-confirmations: ${GIWA_MIN_CONFIRMATIONS:1}
  midnight:
    network-id: ${MIDNIGHT_NETWORK_ID:undeployed}
    demo-enabled: ${MIDNIGHT_DEMO_ENABLED:false}
    demo-state-dir: ${MIDNIGHT_DEMO_STATE_DIR:}
    deployment-manifest: ${MIDNIGHT_DEPLOYMENT_MANIFEST:}
    internal-token: ${MIDNIGHT_DEMO_INTERNAL_TOKEN:}
    read-api-url: ${MIDNIGHT_READ_API_URL:http://127.0.0.1:4100}
    contract-address: ${MIDNIGHT_CONTRACT_ADDRESS:12caaf76aef1de1c584b67462018810f6e4e7eb2535e136f560cb621e24a3f36}
    capability-encryption-key: ${MIDNIGHT_CAPABILITY_ENCRYPTION_KEY:}
    read-timeout-ms: ${MIDNIGHT_READ_TIMEOUT_MS:10000}
    min-valid-for-seconds: ${MIDNIGHT_PROOF_MIN_VALID_FOR_SECONDS:300}
    max-valid-for-seconds: ${MIDNIGHT_PROOF_MAX_VALID_FOR_SECONDS:86400}
